packages:
  - .
  - playground

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  fallow: true
  opensrc: false
  sharp: true
  workerd: true

catalog:
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.1"
  vitest: "^4.1.11"
  vite-plus: "0.3.1"

overrides:
  # AG-UI pins RxJS; use one Observable identity across the playground and client.
  rxjs: "7.8.2"
  vite: "catalog:"
  "vite@8.0.13": "8.0.16"
  vitest: "catalog:"
  dompurify: "3.4.11"
  esbuild: "0.28.1"
  js-yaml: "4.3.0"
  read-yaml-file: "2.1.0"
  ws: "8.21.0"
  undici: "7.28.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
