packages:
  - .
  - playground

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  fallow: true
  opensrc: false
  sharp: true
  workerd: true

catalog:
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.2"
  vitest: "^4.1.11"
  vite-plus: "0.3.2"

overrides:
  # AG-UI pins RxJS; use one Observable identity across the playground and client.
  rxjs: "7.8.2"
  vite: "catalog:"
  vitest: "catalog:"
  dompurify: "3.4.15"
  esbuild: "0.28.1"
  ws: "8.21.0"
  undici: "7.29.1"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
